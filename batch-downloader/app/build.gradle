plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.mahadi.batchdownloader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mahadi.batchdownloader'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.3'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = "3.13"
        buildPython("python3.13")
        pip {
            install("yt-dlp")
        }
    }
}
