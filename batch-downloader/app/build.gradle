plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.mahadi.batchdownloader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mahadi.downloaderfresh'
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName '2.3'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            def ks = System.getenv("MAHADI_KEYSTORE_FILE")
            if (ks != null && !ks.isEmpty()) {
                storeFile file(ks)
                storePassword System.getenv("MAHADI_STORE_PASS")
                keyAlias System.getenv("MAHADI_KEY_ALIAS")
                keyPassword System.getenv("MAHADI_KEY_PASS")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = "3.13"
        buildPython("python3.13")
        pip {
            install("yt-dlp")
        }
    }
}
