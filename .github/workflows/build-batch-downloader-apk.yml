name: Build Mahadi Batch Downloader APK

on:
  push:
    branches:
      - batch-downloader-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          python3.13 --version
          ls -la "$ANDROID_HOME/platforms" | tail -20 || true
          ls -la "$ANDROID_HOME/build-tools" | tail -20 || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: batch-downloader
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahadi-Downloader-v2.0-APK
          path: batch-downloader/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
