name: Build Mahadi Downloader Stable APK

on:
  push:
    branches:
      - batch-downloader-apk
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Restore or create stable signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p signing
          ART_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=Mahadi-Downloader-Signing-Key&per_page=1" --jq '.artifacts[0].id // empty')
          if [ -n "$ART_ID" ]; then
            echo "Restoring existing signing key artifact $ART_ID"
            gh api "repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip" > signing-key.zip
            unzip -o signing-key.zip -d signing >/dev/null
          else
            echo "Creating first stable signing key"
            PASS=$(openssl rand -hex 24)
            keytool -genkeypair -v               -keystore signing/mahadi-release.jks               -storepass "$PASS"               -keypass "$PASS"               -alias mahadi               -keyalg RSA               -keysize 3072               -validity 10000               -dname "CN=Mahadi Downloader, OU=Mahadi, O=Mahadi, L=Muscat, C=OM"
            printf '%s' "$PASS" > signing/password.txt
          fi
          test -f signing/mahadi-release.jks
          test -f signing/password.txt
          PASS=$(cat signing/password.txt)
          echo "MAHADI_KEYSTORE_FILE=$GITHUB_WORKSPACE/signing/mahadi-release.jks" >> "$GITHUB_ENV"
          echo "MAHADI_STORE_PASS=$PASS" >> "$GITHUB_ENV"
          echo "MAHADI_KEY_PASS=$PASS" >> "$GITHUB_ENV"
          echo "MAHADI_KEY_ALIAS=mahadi" >> "$GITHUB_ENV"

      - name: Preserve signing key for future updates
        uses: actions/upload-artifact@v4
        with:
          name: Mahadi-Downloader-Signing-Key
          path: signing/
          retention-days: 90

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build signed release APK
        working-directory: batch-downloader
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs batch-downloader/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahadi-Downloader-v2.2-Stable-APK
          path: batch-downloader/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
